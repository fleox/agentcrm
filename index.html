<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#18181b" />
    <meta name="google" content="notranslate" />
    <!-- The CRM admin is internal-only: never index it. -->
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="googlebot" content="noindex, nofollow, noarchive" />
    <title>AgentCRM</title>
    <script>
      // Anti-FOUC: apply the saved theme synchronously, before React renders.
      (function () {
        try {
          var stored = localStorage.getItem("agentcrm.theme");
          var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = stored === "dark" || stored === "light" ? stored : prefersDark ? "dark" : "light";
          if (theme === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #ffffff;
      }
      html.dark,
      html.dark body {
        background: #0f0f11;
      }
      .agentcrm-boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      .agentcrm-boot-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(113, 113, 122, 0.25);
        border-top-color: #3366ff;
        border-radius: 50%;
        animation: agentcrm-boot-spin 0.85s linear infinite;
      }
      @keyframes agentcrm-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="agentcrm-boot" aria-hidden="true">
        <div class="agentcrm-boot-spinner"></div>
      </div>
    </div>
    <!-- Runtime config bootstrap — must load synchronously, before the
         main bundle. Cache-busted so a freshly written config.js is never
         shadowed by a cached null stub (same trick as cms-ia). -->
    <script>
      document.write('<script src="./config.js?_t=' + Date.now() + '"><\/script>');
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
